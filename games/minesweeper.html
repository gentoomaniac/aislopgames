<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Win95 Minesweeper - Final Stable</title>
    
    <style>
        *, ::before, ::after { box-sizing: border-box; }
        [hidden] { display: none !important; }
        hr { border: 0; opacity: 0.25; }

        :root {
            --win-gray: #c0c0c0;
            --win-white: #ffffff;
            --win-shadow: #808080;
            --win-blue: #000080;
            --page-gutter: 4px;
            /* Horizontal space around the cells: page gutters, window border/padding, panel padding, board border */
            --board-chrome: 36px;
            --cell-max: 30px;
            --cell-min: 20px;
        }

        body {
            background-color: #008080;
            font-family: 'Tahoma', sans-serif;
            display: flex; justify-content: safe center; align-items: safe center;
            min-height: 100vh; min-height: 100dvh; margin: 0; padding: 0 var(--page-gutter);
            font-size: 1rem; line-height: 1.5; color: #212529;
            -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
            /* Panning is allowed so big boards can scroll on phones; pinch and double-tap zoom stay off */
            touch-action: pan-x pan-y;
            
            /* Crucial for mobile: Disables system text selection and iOS long-press popups */
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .outset { border: 2px solid; border-color: var(--win-white) var(--win-shadow) var(--win-shadow) var(--win-white); }
        .inset { border: 2px solid; border-color: var(--win-shadow) var(--win-white) var(--win-white) var(--win-shadow); }

        .window { background-color: var(--win-gray); padding: 3px; display: inline-block; max-width: 100%; box-sizing: border-box; box-shadow: 2px 2px 0px black; }
        
        .title-bar { 
            background: linear-gradient(90deg, var(--win-blue), #1084d0); 
            color: white; padding: 3px 5px; display: flex; 
            justify-content: space-between; align-items: center; 
            font-weight: bold; font-size: 14px; 
        }

        .win-btn { 
            width: 16px; height: 14px; background: var(--win-gray); 
            border: 1px solid; border-color: var(--win-white) var(--win-shadow) var(--win-shadow) var(--win-white); 
            color: black; font-size: 10px; display: flex; align-items: center; justify-content: center; 
        }

        .menu-bar { font-size: 12px; display: flex; border-bottom: 1px solid var(--win-shadow); margin-bottom: 5px; position: relative; }
        .menu-dropdown { position: relative; }
        .menu-trigger { padding: 2px 8px; cursor: pointer; }
        .menu-trigger.active { background: var(--win-blue); color: white; }
        
        .menu-content { 
            display: none; position: absolute; background: var(--win-gray); 
            min-width: 150px; z-index: 1000; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); 
            border: 2px solid; border-color: var(--win-white) var(--win-shadow) var(--win-shadow) var(--win-white);
        }
        .menu-content.open { display: block; }
        .menu-content div { padding: 4px 10px; cursor: pointer; display: flex; justify-content: space-between; color: black; }
        .menu-content div:hover { background: var(--win-blue); color: white; }

        .game-panel { padding: 6px; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 5px; margin-bottom: 6px; }
        
        .digit-display { 
            background-color: black; color: #ff0000; 
            font-family: 'Courier New', monospace; font-weight: bold; 
            font-size: 22px; padding: 0 5px; min-width: 55px; text-align: center; 
        }

        /* Phones: shrink cells to fit the screen, down to --cell-min; wider boards scroll sideways */
        #minefield-scroll { overflow-x: auto; }
        #minefield { --cell: clamp(var(--cell-min), calc((100vw - var(--board-chrome)) / var(--cols)), var(--cell-max)); display: grid; border: 3px solid; border-color: var(--win-shadow) var(--win-white) var(--win-white) var(--win-shadow); }
        
        .cell { 
            width: var(--cell); height: var(--cell); background-color: var(--win-gray); 
            border: 3px solid; border-color: var(--win-white) var(--win-shadow) var(--win-shadow) var(--win-white); 
            display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: min(18px, calc(var(--cell) * 0.7)); 
            position: relative;
        }
        .cell.revealed { border: 1px solid #7b7b7b; background-color: #bdbdbd; }

        /* Sized in em (18px at full cell size) so flags shrink with small cells */
        .flag-icon { position: relative; font-size: min(18px, calc(var(--cell) * 0.6)); width: 0.7778em; height: 1em; pointer-events: none;}
        .flag-pole { position: absolute; left: 0.2222em; top: 0.1111em; width: 0.1111em; height: 0.7778em; background: black; }
        .flag-banner {
            position: absolute; left: 0.3333em; top: 0.1111em; width: 0; height: 0;
            border-top: 0.2778em solid transparent; border-bottom: 0.2778em solid transparent; border-left: 0.4444em solid red;
        }
        .flag-base { position: absolute; left: 0.1111em; top: 0.7778em; width: 0.3333em; height: 0.1111em; background: black; }

        .cell.mine-hit { background-color: red !important; }
        .cell.mine-revealed::after { content: '💣'; font-size: min(16px, calc(var(--cell) * 0.55)); }
        
        .cell.misflagged::after { content: '💣'; font-size: min(16px, calc(var(--cell) * 0.55)); opacity: 0.7; }
        .cell.misflagged::before { 
            content: '✕'; position: absolute; color: red; font-size: min(28px, calc(var(--cell) * 0.93)); 
            z-index: 5; top: calc(var(--cell) * -0.13); font-weight: bold;
        }

        .cell.hint-flash { background-color: #ffd700 !important; border: 2px solid white; transition: background 0.2s; }
        
        .n-1 { color: blue; } .n-2 { color: green; } .n-3 { color: red; } .n-4 { color: darkblue; }
        .n-5 { color: darkred; } .n-6 { color: teal; } .n-7 { color: black; } .n-8 { color: gray; }

        .dialog-backdrop {
            position: fixed; inset: 0; z-index: 1055; padding: 0.5rem;
            display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.5);
        }
        .dialog { display: block; width: 100%; }
        @media (min-width: 576px) { .dialog { max-width: 300px; } }
        .dialog-body { background: var(--win-gray); padding: 10px; }
        .dialog-message { color: black; font-size: 13px; line-height: 1.4; white-space: pre-line; padding: 4px 2px 8px; }
        .dialog-input {
            display: block; width: 100%; margin-bottom: 4px; padding: 4px 6px; background: var(--win-white); color: black;
            font-family: inherit; font-size: 16px; /* 16px keeps mobile browsers from zooming in on focus */
        }
        .dialog-buttons { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
        .dialog-button {
            flex: 1; padding: 0.25rem 0.5rem;
            font-family: inherit; font-size: 0.875rem; line-height: 1.5; color: #212529; text-align: center;
            background: var(--win-gray); border-radius: 0; cursor: pointer;
        }
        @media (pointer: coarse) { .dialog-button { min-height: 2.75rem; } }
        .dialog-button:focus-visible { outline: 1px dotted black; outline-offset: -6px; }
        .score-list-container { background: var(--win-gray); border: 2px solid; border-color: var(--win-shadow) var(--win-white) var(--win-white) var(--win-shadow); height: 220px; }
        .score-table { width: 100%; border-collapse: collapse; font-size: 13px; color: black; }
        .score-table td:last-child { text-align: right; }

        @media (max-width: 600px) { :root { --cell-max: 28px; } }
    </style>
</head>
<body>

<div class="window outset">
    <div class="title-bar">
        <span>Minesweeper</span>
        <div style="display:flex; gap:2px">
            <div class="win-btn">_</div><div class="win-btn">□</div><div class="win-btn" style="margin-left:2px">✕</div>
        </div>
    </div>
    
    <div class="menu-bar">
        <div class="menu-dropdown">
            <div class="menu-trigger" id="game-menu-trigger">Game</div>
            <div class="menu-content" id="game-menu-content">
                <div id="btn-new-game">New</div>
                <hr style="margin:2px 0; border-top: 1px solid gray;">
                <div class="diff-opt" data-lvl="beginner">Beginner <span id="check-beginner"></span></div>
                <div class="diff-opt" data-lvl="intermediate">Intermediate <span id="check-intermediate"></span></div>
                <div class="diff-opt" data-lvl="expert">Expert <span id="check-expert"></span></div>
                <hr style="margin:2px 0; border-top: 1px solid gray;">
                <div id="btn-scores">Best Times...</div>
            </div>
        </div>
        <div class="menu-trigger" id="help-trigger">Help</div>
    </div>

    <div class="game-panel">
        <div class="status-bar inset">
            <div id="mine-count" class="digit-display">000</div>
            <div id="reset-btn" class="outset" style="width:36px; height:36px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size: 22px;">🙂</div>
            <div id="timer" class="digit-display">000</div>
        </div>
        <div id="minefield-scroll"><div id="minefield"></div></div>
    </div>
</div>

<div class="dialog-backdrop" id="dialog" hidden>
    <div class="dialog window outset" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
        <div class="title-bar"><span id="dialog-title"></span></div>
        <div class="dialog-body">
            <div id="dialog-content"></div>
            <input class="dialog-input inset" id="dialog-input" type="text" autocomplete="off" hidden>
            <div class="dialog-buttons">
                <button class="dialog-button outset" id="dialog-ok"></button>
                <button class="dialog-button outset" id="dialog-cancel"></button>
            </div>
        </div>
    </div>
</div>

<script>
    const STORAGE_KEY = 'win95_minesweeper_permanent_scores';

    let rows, cols, mines, grid, timer, startTimeMs, hintPenaltySeconds, gameOver, flags, safeCellsRevealed, first;
    let cellHoldTimer, faceHoldTimer;
    let facePressPointerType = null; // Set while a pointer is down on the smiley
    let faceWasLongPress = false;
    let pressedCell = null; // {row, col} while a pointer is down on a cell and still counts as a tap
    let lastTap = null; // {row, col, timeMs} of the last completed tap/click, for double-tap chording
    let blockContextMenu = false; // Prevents the double-triggering of contextmenu
    const HOLD_DELAY = 500;
    const DOUBLE_TAP_DELAY = 300;
    const FACE_HOLD_DELAY = 800;
    const MAX_TIME_SECONDS = 999; // What the timer display can show; scores use the same cap
    const MAX_SCORES_PER_LEVEL = 10;
    const MAX_NAME_LENGTH = 12;
    const GHOST_CLICK_WINDOW_MS = 400;
    const HELP_TEXT = 'Controls:\n- Click Smiley: New Game\n- Right Click Smiley: Hint (+5s)\n- Right Click Number: Chord Sweep\n- Double Tap Number: Chord Sweep\n- Right Click/Long Press Cell: Toggle Flag / Question Mark';
    const HINT_PENALTY_SECONDS = 5;
    const TIMER_REFRESH_MS = 250;
    const FLAG_HTML = '<div class="flag-icon"><div class="flag-pole"></div><div class="flag-banner"></div><div class="flag-base"></div></div>';

    const levels = {
        beginner: { r: 9, c: 9, m: 10, base: 20 },
        intermediate: { r: 16, c: 16, m: 40, base: 85 },
        expert: { r: 16, c: 30, m: 99, base: 190 }
    };
    let currentLvl = 'beginner';

    const gameMenuTrigger = document.getElementById('game-menu-trigger');
    const gameMenuContent = document.getElementById('game-menu-content');
    const mineCountDisplay = document.getElementById('mine-count');
    const timerDisplay = document.getElementById('timer');
    const faceButton = document.getElementById('reset-btn');
    const minefield = document.getElementById('minefield');
    const dialogBackdrop = document.getElementById('dialog');
    const dialogTitle = document.getElementById('dialog-title');
    const dialogContent = document.getElementById('dialog-content');
    const dialogInput = document.getElementById('dialog-input');
    const dialogOkButton = document.getElementById('dialog-ok');
    const dialogCancelButton = document.getElementById('dialog-cancel');

    // ---- In-page dialog (no blocking alert/confirm/prompt): Enter = OK, Escape or a click outside = Cancel ----

    let finishDialog = null; // Set while a dialog is open; closes it with the player's answer
    let dialogShownAtMs = 0;

    // A tap that opens a dialog ends with a synthesized click on whatever is now under the finger, e.g. the dialog's own buttons
    function isGhostClick() {
        return Date.now() - dialogShownAtMs < GHOST_CLICK_WINDOW_MS;
    }

    // content is text or a DOM node. Resolves to { isOk, text }; text is only meaningful with inputMaxLength.
    function showDialog({ title, content, okLabel = 'OK', cancelLabel = null, inputMaxLength = 0 }) {
        finishDialog?.(false);
        dialogTitle.textContent = title;
        dialogContent.replaceChildren(content);
        dialogOkButton.textContent = okLabel;
        dialogCancelButton.textContent = cancelLabel;
        dialogCancelButton.hidden = cancelLabel === null;
        dialogInput.hidden = inputMaxLength === 0;
        dialogInput.maxLength = inputMaxLength;
        dialogInput.value = '';
        dialogBackdrop.hidden = false;
        dialogShownAtMs = Date.now();
        if (inputMaxLength > 0) dialogInput.focus();

        return new Promise((resolve) => {
            finishDialog = (isOk) => {
                finishDialog = null;
                dialogBackdrop.hidden = true;
                resolve({ isOk, text: dialogInput.value });
            };
        });
    }

    function createMessage(text) {
        const message = document.createElement('div');
        message.className = 'dialog-message';
        message.textContent = text;
        return message;
    }

    async function askConfirm(question) {
        const { isOk } = await showDialog({ title: 'Minesweeper', content: createMessage(question), okLabel: 'Yes', cancelLabel: 'No' });
        return isOk;
    }

    dialogOkButton.addEventListener('click', () => { if (!isGhostClick()) finishDialog?.(true); });
    dialogCancelButton.addEventListener('click', () => { if (!isGhostClick()) finishDialog?.(false); });
    dialogBackdrop.addEventListener('click', (e) => { if (e.target === dialogBackdrop && !isGhostClick()) finishDialog?.(false); });
    document.addEventListener('keydown', (e) => {
        if (!finishDialog) return;
        if (e.key === 'Escape') finishDialog(false);
        // A focused button handles Enter itself, so Enter on Cancel still cancels
        else if (e.key === 'Enter' && e.target.tagName !== 'BUTTON') finishDialog(true);
    });

    function closeMenus() {
        gameMenuContent.classList.remove('open');
        gameMenuTrigger.classList.remove('active');
    }

    gameMenuTrigger.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = gameMenuContent.classList.toggle('open');
        gameMenuTrigger.classList.toggle('active', isOpen);
    });

    document.getElementById('help-trigger').addEventListener('click', () => {
        closeMenus();
        showDialog({ title: 'Help', content: createMessage(HELP_TEXT) });
    });

    document.getElementById('btn-new-game').addEventListener('click', () => {
        closeMenus();
        confirmNewGame();
    });

    async function confirmNewGame() {
        if (first || gameOver || await askConfirm('Reset current game?')) initGame();
    }

    document.querySelectorAll('.diff-opt').forEach((option) => {
        option.addEventListener('click', () => {
            closeMenus();
            currentLvl = option.dataset.lvl;
            initGame();
        });
    });

    document.getElementById('btn-scores').addEventListener('click', () => { closeMenus(); showLeaderboard(); });
    document.addEventListener('click', closeMenus);

    function initGame() {
        clearInterval(timer);
        const config = levels[currentLvl];
        rows = config.r; cols = config.c; mines = config.m;
        startTimeMs = null; hintPenaltySeconds = 0; safeCellsRevealed = 0; flags = 0; gameOver = false; first = true;
        
        document.querySelectorAll('.diff-opt span').forEach((check) => { check.textContent = ''; });
        document.getElementById(`check-${currentLvl}`).textContent = '✓';

        timerDisplay.textContent = '000';
        mineCountDisplay.textContent = String(mines).padStart(3, '0');
        faceButton.textContent = '🙂';

        minefield.replaceChildren();
        minefield.style.gridTemplateColumns = `repeat(${cols}, auto)`;
        minefield.style.setProperty('--cols', cols);
        grid = Array.from({ length: rows }, () => []);

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const el = document.createElement('div');
                el.className = 'cell';
                el.dataset.row = r;
                el.dataset.col = c;
                minefield.append(el);

                grid[r][c] = { isM: false, rev: false, flg: false, qst: false, n: 0, el };
            }
        }
    }

    // ---- Cell input: Pointer Events, one code path for mouse, touch and pen ----

    function cellFromElement(element) {
        const cellElement = element?.closest('.cell');
        return cellElement ? { row: Number(cellElement.dataset.row), col: Number(cellElement.dataset.col) } : null;
    }

    function isSameCell(a, b) {
        return a !== null && b !== null && a.row === b.row && a.col === b.col;
    }

    function resetFace() {
        if (!gameOver) faceButton.textContent = '🙂';
    }

    function cancelPress() {
        clearTimeout(cellHoldTimer);
        cellHoldTimer = null;
        pressedCell = null;
        resetFace();
    }

    function startHoldToFlag(cell) {
        cellHoldTimer = setTimeout(() => {
            cellHoldTimer = null;
            pressedCell = null;
            blockContextMenu = true; // The browser may fire a contextmenu for the same long press
            setTimeout(() => blockContextMenu = false, 500);
            handleCycleMark(cell.row, cell.col);
            resetFace();
        }, HOLD_DELAY);
    }

    minefield.addEventListener('pointerdown', (e) => {
        const cell = cellFromElement(e.target);
        if (!cell || gameOver) return;
        const isMouse = e.pointerType === 'mouse';
        if (isMouse && e.button !== 0) return; // Right click is handled by contextmenu

        const isDoubleTap = isSameCell(cell, lastTap) && Date.now() - lastTap.timeMs < DOUBLE_TAP_DELAY;
        if (isDoubleTap && grid[cell.row][cell.col].rev) {
            lastTap = null;
            cancelPress();
            handleChord(cell.row, cell.col);
            return;
        }

        pressedCell = cell;
        faceButton.textContent = '😮';
        clearTimeout(cellHoldTimer);
        // A slow mouse click is still a click; only touch and pen hold to flag
        if (!isMouse) startHoldToFlag(cell);
    });

    document.addEventListener('pointermove', (e) => {
        if (!pressedCell) return;
        const cellUnderPointer = cellFromElement(document.elementFromPoint(e.clientX, e.clientY));
        if (!isSameCell(cellUnderPointer, pressedCell)) cancelPress();
    });

    document.addEventListener('pointerup', (e) => {
        if (!pressedCell) return;
        const releasedOn = cellFromElement(document.elementFromPoint(e.clientX, e.clientY));
        const tappedCell = pressedCell;
        cancelPress();
        if (!isSameCell(releasedOn, tappedCell)) return;
        lastTap = { row: tappedCell.row, col: tappedCell.col, timeMs: Date.now() };
        handleAction(tappedCell.row, tappedCell.col);
    });

    document.addEventListener('pointercancel', cancelPress);

    minefield.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        const cell = cellFromElement(e.target);
        if (!cell || gameOver || blockContextMenu) return;

        cancelPress();
        const { rev, n } = grid[cell.row][cell.col];
        if (rev && n > 0) handleChord(cell.row, cell.col);
        else handleCycleMark(cell.row, cell.col);
    });

    function handleChord(r, c) {
        const cell = grid[r][c];
        let flagCount = 0;
        let neighbors = [];
        for (let i = -1; i <= 1; i++) {
            for (let j = -1; j <= 1; j++) {
                if (i === 0 && j === 0) continue;
                if (grid[r+i] && grid[r+i][c+j]) {
                    let n = grid[r+i][c+j];
                    neighbors.push({r: r+i, c: c+j, data: n});
                    if (n.flg) flagCount++;
                }
            }
        }
        if (flagCount === cell.n) {
            const targets = neighbors.filter(n => !n.data.flg && !n.data.rev);
            // Safe cells first so nothing gets flood-revealed after a wrongly flagged chord hits a mine.
            targets.filter(n => !n.data.isM).forEach(n => reveal(n.r, n.c));
            targets.filter(n => n.data.isM).forEach(n => hitMine(n.data));
            checkWin();
        }
    }

    // ---- Smiley: click = new game, right-click or long press = hint ----

    function cancelFacePress() {
        clearTimeout(faceHoldTimer);
        faceHoldTimer = null;
        facePressPointerType = null;
        resetFace();
    }

    faceButton.addEventListener('pointerdown', (e) => {
        const pointerType = e.pointerType;
        if (pointerType === 'mouse' && e.button !== 0) return; // Right click is handled by contextmenu

        facePressPointerType = pointerType;
        faceWasLongPress = false;
        faceButton.textContent = '😮';
        if (pointerType !== 'mouse') {
            faceHoldTimer = setTimeout(() => {
                if (!first && !gameOver) { giveHint(); faceWasLongPress = true; }
            }, FACE_HOLD_DELAY);
        }
    });

    faceButton.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        // A touch long press fires contextmenu too, but the hold timer already gives that hint
        if (facePressPointerType === null && !first && !gameOver) giveHint();
    });

    // Document-level move/up/cancel handlers (the cells register theirs above): a press can end anywhere,
    // and touch pointers stay captured by the element they started on. Cells and smiley track separate state.
    document.addEventListener('pointermove', (e) => {
        if (facePressPointerType === null) return;
        if (!document.elementFromPoint(e.clientX, e.clientY)?.closest('#reset-btn')) cancelFacePress();
    });

    document.addEventListener('pointerup', (e) => {
        if (facePressPointerType === null) return;
        const releasedOnFace = document.elementFromPoint(e.clientX, e.clientY)?.closest('#reset-btn');
        const wasLongPress = faceWasLongPress;
        cancelFacePress();
        if (releasedOnFace && !wasLongPress) confirmNewGame();
    });

    document.addEventListener('pointercancel', cancelFacePress);

    function giveHint() {
        let safeCells = grid.flat().filter(c => !c.isM && !c.rev && !c.flg);
        if (safeCells.length > 0) {
            const hint = safeCells[Math.floor(Math.random() * safeCells.length)];
            hint.el.classList.add('hint-flash');
            hintPenaltySeconds += HINT_PENALTY_SECONDS;
            showElapsedTime();
            setTimeout(() => hint.el.classList.remove('hint-flash'), 1500);
        }
    }

    function handleCycleMark(r, c) {
        if (gameOver) return;
        const cell = grid[r][c];
        if (cell.rev) return;

        cell.el.replaceChildren();

        // Cycle Pattern: None -> Flag -> Question -> None
        if (!cell.flg && !cell.qst) {
            cell.flg = true;
            cell.el.innerHTML = FLAG_HTML;
            flags++;
        } else if (cell.flg) {
            cell.flg = false;
            cell.qst = true;
            cell.el.textContent = '?';
            flags--;
        } else {
            cell.qst = false;
        }

        mineCountDisplay.textContent = String(Math.max(0, mines - flags)).padStart(3, '0');
    }

    function handleAction(r, c) {
        if (gameOver) return;
        const cell = grid[r][c];
        
        if (cell.flg || cell.qst || cell.rev) return;

        if (first) { spawnMines(r, c); startClock(); first = false; }
        reveal(r, c);
        checkWin();
    }

    function spawnMines(exR, exC) {
        let p = 0;
        while (p < mines) {
            let r = Math.floor(Math.random() * rows), c = Math.floor(Math.random() * cols);
            if (!grid[r][c].isM && (Math.abs(r-exR) > 1 || Math.abs(c-exC) > 1)) { grid[r][c].isM = true; p++; }
        }
        for(let r=0; r<rows; r++) for(let c=0; c<cols; c++) {
            if(!grid[r][c].isM) {
                let count = 0;
                for(let i=-1; i<=1; i++) for(let j=-1; j<=1; j++) if(grid[r+i] && grid[r+i][c+j]?.isM) count++;
                grid[r][c].n = count;
            }
        }
    }

    function hitMine(cell) {
        cell.rev = true;
        cell.el.replaceChildren();
        cell.el.classList.add('revealed', 'mine-hit');
        end(false);
    }

    function reveal(r, c) {
        const cell = grid[r][c];
        if (gameOver || cell.rev || cell.flg) return;
        if (cell.isM) { hitMine(cell); return; }
        cell.rev = true; cell.el.replaceChildren(); cell.el.classList.add('revealed');
        safeCellsRevealed++;
        if (cell.n > 0) { cell.el.textContent = cell.n; cell.el.classList.add('n-'+cell.n); }
        else { for(let i=-1; i<=1; i++) for(let j=-1; j<=1; j++) if(grid[r+i] && grid[r+i][c+j]) reveal(r+i, c+j); }
    }

    // Called once after a whole click or chord, not per revealed cell, so a flood fill can't win repeatedly.
    function checkWin() {
        if (!gameOver && safeCellsRevealed === (rows * cols) - mines) end(true);
    }

    // Derived from the wall clock because background tabs throttle timers, so counting ticks would under-count
    function getElapsedSeconds() {
        return Math.floor((Date.now() - startTimeMs) / 1000) + hintPenaltySeconds;
    }

    function showElapsedTime() {
        const displayedSeconds = Math.min(getElapsedSeconds(), MAX_TIME_SECONDS);
        timerDisplay.textContent = String(displayedSeconds).padStart(3, '0');
    }

    function startClock() {
        startTimeMs = Date.now();
        timer = setInterval(showElapsedTime, TIMER_REFRESH_MS);
    }

    function end(win) {
        if (gameOver) return;
        gameOver = true; clearInterval(timer);
        showElapsedTime();
        faceButton.textContent = win ? '😎' : '😵';
        if (!win) {
            grid.flat().forEach(c => {
                if (c.isM && !c.flg) {
                    c.el.replaceChildren();
                    c.el.classList.add('mine-revealed', 'revealed');
                }
                else if (!c.isM && c.flg) {
                    c.el.replaceChildren();
                    c.el.classList.add('misflagged', 'revealed');
                }
            });
        } else {
            grid.flat().forEach(c => { if(c.isM && !c.flg) { c.flg = true; c.el.innerHTML = FLAG_HTML; } });
            mineCountDisplay.textContent = '000';
            const level = currentLvl;
            const time = Math.min(getElapsedSeconds(), MAX_TIME_SECONDS);
            if (isTopScore(level, time)) askNameAndSaveScore(level, time);
        }
    }

    const LEGACY_STORAGE_KEYS = ['ms_final_sri', 'ms_final_v11', 'ms_final_v10', 'ms_final_chord'];
    let scoresInMemory = null; // Only used when localStorage can't be written, so scores last for the session

    function isValidScoreEntry(entry) {
        return typeof entry === 'object' && entry !== null && typeof entry.name === 'string' && Number.isFinite(entry.time);
    }

    // Keeps whatever is usable per level, so one bad entry or level never costs the player's other scores
    function sanitizeScores(data) {
        const seededScores = createSeededScores();
        const scores = {};
        Object.keys(levels).forEach(lvl => {
            scores[lvl] = Array.isArray(data[lvl])
                ? data[lvl].filter(isValidScoreEntry).sort((a, b) => a.time - b.time)
                : seededScores[lvl];
        });
        return scores;
    }

    function readStoredScores(key) {
        try {
            const data = JSON.parse(localStorage.getItem(key));
            const isScoreObject = typeof data === 'object' && data !== null && !Array.isArray(data);
            return isScoreObject ? sanitizeScores(data) : null;
        } catch (e) {
            return null;
        }
    }

    function writeStoredScores(scores) {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(scores));
            scoresInMemory = null;
        } catch (e) {
            scoresInMemory = scores;
        }
    }

    function createSeededScores() {
        const scores = {};
        const ai = ["Gemini", "DeepBlue", "Clippy", "Woz", "Ada", "Turing", "Hopper", "Carmack", "Gates", "Jobs"];
        Object.keys(levels).forEach(lvl => {
            scores[lvl] = ai.map((name, i) => ({ name, time: levels[lvl].base + (i * 10) }));
        });
        return scores;
    }

    // Reading never writes, except migrating legacy data; only saveScore persists changes
    function getScores() {
        if (scoresInMemory) return scoresInMemory;
        const storedScores = readStoredScores(STORAGE_KEY);
        if (storedScores) return storedScores;
        for (const key of LEGACY_STORAGE_KEYS) {
            const legacyScores = readStoredScores(key);
            if (legacyScores) { writeStoredScores(legacyScores); return legacyScores; }
        }
        return createSeededScores();
    }

    // A tie with the last place doesn't qualify: saveScore sorts the newer entry behind older ones
    function isTopScore(level, time) {
        const best = getScores()[level] || [];
        return best.length < MAX_SCORES_PER_LEVEL || time < best[best.length - 1].time;
    }

    async function askNameAndSaveScore(level, time) {
        const { isOk, text } = await showDialog({
            title: 'High Score!', content: createMessage('Enter your name:'),
            okLabel: 'OK', cancelLabel: 'Cancel', inputMaxLength: MAX_NAME_LENGTH,
        });
        if (isOk && text) saveScore(level, text, time);
    }

    function saveScore(level, name, time) {
        let s = getScores();
        if (!s[level]) s[level] = [];
        s[level].push({ name: name.substring(0, MAX_NAME_LENGTH), time });
        s[level].sort((a,b) => a.time - b.time);
        s[level] = s[level].slice(0, MAX_SCORES_PER_LEVEL);
        writeStoredScores(s);
        showLeaderboard(level);
    }

    function showLeaderboard(level = currentLvl) {
        const s = getScores()[level] || [];
        const scoreTable = document.createElement('table');
        scoreTable.className = 'score-table';
        s.forEach((x, i) => {
            // Names are user input, so they go in as text, never as HTML
            const rank = document.createElement('td');
            rank.style.width = '25px';
            rank.textContent = `${i+1}.`;
            const name = document.createElement('td');
            name.textContent = x.name;
            const time = document.createElement('td');
            time.textContent = `${Number(x.time)}s`;
            const row = document.createElement('tr');
            row.append(rank, name, time);
            scoreTable.append(row);
        });
        const scoreList = document.createElement('div');
        scoreList.className = 'score-list-container';
        scoreList.append(scoreTable);
        showDialog({ title: level.toUpperCase() + " Ranking", content: scoreList });
    }

    initGame();
</script>
</body>
