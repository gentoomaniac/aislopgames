                    const maskA = state.candidates[pincerA];
                    const maskB = state.candidates[pincerB];
                    const shared = maskA & maskB;
                    if (maskA === maskB || bitCount(shared) !== 1) return false;
                    const isWing = isXYZ ? isXYZWing(pivotMask, maskA, maskB) : isXYWing(pivotMask, maskA, maskB, shared);
                    if (!isWing) return false;
                    const zCells = isXYZ ? [pivot, pincerA, pincerB] : [pincerA, pincerB];
                    const victims = state.geometry.peers[pincerA].filter(cell => (
                        !zCells.includes(cell) && zCells.every(zCell => seesCell(state, cell, zCell))
                    ));
                    return eliminateFromCells(state, victims, shared);
                });
                if (found) return true;
            }
            return false;
        }

        // Strong link: a house where a digit fits in exactly two cells (one of them must be it).
        function findStrongLinks(state, digitIndex) {
            const links = [];
            for (const house of state.geometry.houses) {
                const cells = cellsWithDigit(state, house, digitIndex);
                if (cells.length === 2) links.push(cells);
            }
            return links;
        }

        // True if the strong link's two ends can be told apart as one seeing `first` and the other
        // seeing `second`, without being either of them.
        function linkBridges(state, [nearFirst, nearSecond], first, second) {
            const isEndpoint = cell => cell === first || cell === second;
            if (isEndpoint(nearFirst) || isEndpoint(nearSecond)) return false;
            return seesCell(state, nearFirst, first) && seesCell(state, nearSecond, second);
        }

        // W-Wing: two cells with the same candidate pair {a, b} joined by a strong link on a,
        // one end seeing each cell. One of the two cells must be b, so cells seeing both lose b.
        function applyWWing(state) {
            const pairCells = [];
            for (let cell = 0; cell < state.cellCount; cell++) {
                if (bitCount(state.candidates[cell]) === 2) pairCells.push(cell);
            }

            return someCombination(pairCells, 2, ([first, second]) => {
                const pair = state.candidates[first];
                if (pair !== state.candidates[second] || seesCell(state, first, second)) return false;
                const victims = state.geometry.peers[first].filter(cell => seesCell(state, cell, second));
                for (let a = 0; a < state.gridSize; a++) {
                    if (!((pair >> a) & 1)) continue;
                    const otherDigit = pair & ~(1 << a);
                    for (const [endA, endB] of findStrongLinks(state, a)) {
                        const bridges = linkBridges(state, [endA, endB], first, second)
                            || linkBridges(state, [endB, endA], first, second);
                        if (bridges && eliminateFromCells(state, victims, otherDigit)) return true;
                    }
                }
                return false;
            });
        }

        // Cells joined by strong links on one digit, as a map from each cell to its linked cells.
        function strongLinkNeighbours(state, digitIndex) {
            const neighbours = new Map();
            for (const [a, b] of findStrongLinks(state, digitIndex)) {
                neighbours.set(a, [...(neighbours.get(a) || []), b]);
                neighbours.set(b, [...(neighbours.get(b) || []), a]);
            }
            return neighbours;
        }

        // The chain of strong links through `start`, split into its two alternating colours.
        function colourChain(neighbours, start, colourOf) {
            const chain = [[start], []];
            colourOf.set(start, 0);
            const queue = [start];
            while (queue.length) {
                const cell = queue.shift();
                for (const next of neighbours.get(cell)) {
                    if (colourOf.has(next)) continue;
                    const colour = 1 - colourOf.get(cell);
                    colourOf.set(next, colour);
                    chain[colour].push(next);
                    queue.push(next);
                }
            }
            return chain;
        }

        // Simple colouring: strong links on one digit form chains whose cells alternate between two
        // colours, exactly one of which is true. Two same-coloured cells in a house make that colour
        // false (wrap); a cell seeing both colours cannot hold the digit (trap).
        function applySimpleColouring(state) {
            for (let d = 0; d < state.gridSize; d++) {
                const neighbours = strongLinkNeighbours(state, d);
                const colourOf = new Map();
                for (const start of neighbours.keys()) {
                    if (colourOf.has(start)) continue;
                    const chain = colourChain(neighbours, start, colourOf);

                    const clashing = [0, 1].find(colour => chain[colour].some((a, i) => (
                        chain[colour].slice(i + 1).some(b => seesCell(state, a, b))
                    )));
                    if (clashing !== undefined) {
                        eliminateFromCells(state, chain[clashing], 1 << d);
                        return true;
                    }

                    const victims = [];
                    for (let cell = 0; cell < state.cellCount; cell++) {
                        const isChainCell = chain[0].includes(cell) || chain[1].includes(cell);
                        if (!((state.candidates[cell] >> d) & 1) || isChainCell) continue;
                        const seesColour = colour => chain[colour].some(chainCell => seesCell(state, cell, chainCell));
                        if (seesColour(0) && seesColour(1)) victims.push(cell);
                    }
                    if (eliminateFromCells(state, victims, 1 << d)) return true;
                }
            }
            return false;
        }

        // ---- Master techniques: chains and almost locked sets ----
        // A chain node is a candidate: cell * gridSize + digitIndex. Two candidates are strongly
        // linked when exactly one of them is true (two candidates of a cell, or the only two cells
        // of a house for a digit) and weakly linked when at most one is true (same cell, or same
        // digit in cells that see each other).

        // Longest alternating inference chain tried, in candidates. 12 nodes is six strong links
        // joined by five weak ones: about the longest a player can still follow by hand and
        // check link by link. It also keeps the search cheap enough to rate puzzles in the browser.
        const MAX_CHAIN_NODES = 12;

        function areWeaklyLinked(state, nodeA, nodeB) {
            const n = state.gridSize;
            const cellA = Math.floor(nodeA / n);
            const cellB = Math.floor(nodeB / n);
            if (nodeA === nodeB) return false;
            return cellA === cellB || (nodeA % n === nodeB % n && seesCell(state, cellA, cellB));
        }

        // For every candidate: the candidates it is strongly linked to and those it is weakly linked to.
        function findChainLinks(state) {
            const n = state.gridSize;
            const strong = Array.from({ length: state.cellCount * n }, () => []);
            const weak = Array.from({ length: state.cellCount * n }, () => []);
            const addStrong = (a, b) => {
                if (strong[a].includes(b)) return;
                strong[a].push(b);
                strong[b].push(a);
            };

            for (let cell = 0; cell < state.cellCount; cell++) {
                const mask = state.candidates[cell];
                for (let d = 0; d < n; d++) {
                    if (!((mask >> d) & 1)) continue;
                    for (let other = 0; other < n; other++) {
                        if (other !== d && (mask >> other) & 1) weak[cell * n + d].push(cell * n + other);
                    }
                    for (const peer of state.geometry.peers[cell]) {
                        if ((state.candidates[peer] >> d) & 1) weak[cell * n + d].push(peer * n + d);
                    }
                }
                if (bitCount(mask) === 2) {
                    const low = Math.log2(mask & -mask);
                    addStrong(cell * n + low, cell * n + Math.log2(mask & (mask - 1)));
                }
            }
            for (let d = 0; d < n; d++) {
                for (const [a, b] of findStrongLinks(state, d)) addStrong(a * n + d, b * n + d);
            }
            return { strong, weak };
        }

        // The chain "start is false, so ... so end is true" shows that start or end is true.
        // Candidates weakly linked to both therefore cannot be true. When end is start the chain
        // is a loop that proves start true: its cell keeps only that digit and its peers lose it.
        function applyChainConclusion(state, links, start, end) {
            const n = state.gridSize;
            const cellOf = node => Math.floor(node / n);
            if (start === end) {
                const cell = cellOf(start);
                const digitMask = 1 << (start % n);
                const clearedCell = eliminate(state, cell, state.allDigits & ~digitMask);
                const clearedPeers = eliminateFromCells(state, state.geometry.peers[cell], digitMask);
                return clearedCell || clearedPeers;
            }
            let changed = false;
            for (const victim of links.weak[start]) {
                if (victim !== end && areWeaklyLinked(state, victim, end)) {
                    if (eliminate(state, cellOf(victim), 1 << (victim % n))) changed = true;
                }
            }
            return changed;
        }

        // Adds one more candidate to every chain of `search`; true if a chain ending in a true
        // candidate led to an elimination. A search state is node * 2 + (1 if the node is true).
        function extendChainSearch(state, links, search) {
            const next = [];
            for (const searchState of search.frontier) {
                const node = searchState >> 1;
                const isTrue = (searchState & 1) === 1;
                for (const target of isTrue ? links.weak[node] : links.strong[node]) {
                    const targetState = target * 2 + (isTrue ? 0 : 1);
                    if (search.seen[targetState]) continue;
                    search.seen[targetState] = 1;
                    next.push(targetState);
                    if (!isTrue && applyChainConclusion(state, links, search.start, target)) return true;
                }
            }
            search.frontier = next;
            return false;
        }

        // Alternating inference chains, which include X-Chains (one digit) and XY-Chains (only
        // two-candidate cells): from a candidate assumed false, strong links make the next
        // candidate true and weak links make the one after it false, and so on. Breadth-first
        // search over (candidate, true/false) finds the shortest chain to each candidate that
        // ends up true. Every step is an implication, so the conclusions hold even when the
        // search reuses a candidate in both roles. All searches grow one candidate at a time, so
        // the shortest chain anywhere on the board is used first. Grouped nodes are not used.
        function applyAlternatingChain(state) {
            const links = findChainLinks(state);
            const nodeCount = links.strong.length;
            const searches = [];
            for (let start = 0; start < nodeCount; start++) {
                if (links.strong[start].length === 0) continue;
                const seen = new Uint8Array(nodeCount * 2);
                seen[start * 2] = 1;
                searches.push({ start, seen, frontier: [start * 2] });
            }
            for (let chainNodes = 1; chainNodes < state.maxChainNodes; chainNodes++) {
                if (searches.some(search => extendChainSearch(state, links, search))) return true;
            }
            return false;
        }

        // Longest almost locked set used by ALS-XZ, in cells. Bigger sets are rare in practice and
        // hard to see by eye; this also bounds the search.
        const MAX_ALS_CELLS = 4;

        // Almost locked set: n cells of one house holding n + 1 different candidates in total.
        function findAlmostLockedSets(state) {
            const sets = new Map();
            for (const house of state.geometry.houses) {
                const openCells = house.filter(cell => state.candidates[cell] !== 0);
                for (let size = 1; size <= MAX_ALS_CELLS; size++) {
                    someCombination(openCells, size, combo => {
                        const digits = combo.reduce((mask, cell) => mask | state.candidates[cell], 0);
                        const key = combo.join(',');
                        const isAlmostLocked = bitCount(digits) === size + 1;
                        if (isAlmostLocked && !sets.has(key)) sets.set(key, { cells: [...combo], digits });
                        return false;
                    });
                }
            }
            return [...sets.values()];
        }

        function cellsHoldingDigit(state, cells, digitIndex) {
            return cells.filter(cell => (state.candidates[cell] >> digitIndex) & 1);
        }

        // ALS-XZ: two almost locked sets that share no cell and have a digit x such that every
        // x cell of one sees every x cell of the other (x is "restricted"). One set must then be
        // without x, which locks it onto its other digits, so a second shared digit z is in one of
        // the two. Cells seeing every z cell of both sets cannot be z.
        function applyAlsXz(state) {
            const sets = findAlmostLockedSets(state);
            for (let i = 0; i < sets.length; i++) {
                for (let j = i + 1; j < sets.length; j++) {
                    const [setA, setB] = [sets[i], sets[j]];
                    const shared = setA.digits & setB.digits;
                    if (bitCount(shared) < 2 || setA.cells.some(cell => setB.cells.includes(cell))) continue;
                    for (let x = 0; x < state.gridSize; x++) {
                        if (!((shared >> x) & 1)) continue;
                        const xCellsA = cellsHoldingDigit(state, setA.cells, x);
                        const xCellsB = cellsHoldingDigit(state, setB.cells, x);
                        const isRestricted = xCellsA.every(a => xCellsB.every(b => seesCell(state, a, b)));
                        if (!isRestricted) continue;
                        for (let z = 0; z < state.gridSize; z++) {
                            if (z === x || !((shared >> z) & 1)) continue;
                            const zCells = [
                                ...cellsHoldingDigit(state, setA.cells, z),
                                ...cellsHoldingDigit(state, setB.cells, z)
                            ];
                            const victims = state.geometry.peers[zCells[0]].filter(cell => (
                                zCells.every(zCell => seesCell(state, cell, zCell))
                            ));
                            if (eliminateFromCells(state, victims, 1 << z)) return true;
                        }
                    }
                }
            }
            return false;
        }

        // Ordered easiest to hardest. Expert is what goes beyond the Hard set: Jellyfish, W-Wing and
        // simple colouring. Master needs chains or almost locked sets (no guessing, no trial and
        // error). Puzzles that even these cannot finish are "unsolved by logic".
        const LOGIC_TECHNIQUES = [
            { tier: TIER.EASY, apply: applyNakedSingle },
            { tier: TIER.EASY, apply: applyHiddenSingle },
            { tier: TIER.MEDIUM, apply: applyLockedCandidates },
            { tier: TIER.MEDIUM, apply: state => applyNakedSubset(state, 2) },
            { tier: TIER.MEDIUM, apply: state => applyHiddenSubset(state, 2) },
            { tier: TIER.HARD, apply: state => applyNakedSubset(state, 3) },
            { tier: TIER.HARD, apply: state => applyHiddenSubset(state, 3) },
            { tier: TIER.HARD, apply: state => applyFish(state, 2) },
            { tier: TIER.HARD, apply: state => applyWing(state, 2) },
            { tier: TIER.HARD, apply: state => applyWing(state, 3) },
            { tier: TIER.HARD, apply: state => applyFish(state, 3) },
            { tier: TIER.HARD, apply: state => applyNakedSubset(state, 4) },
            { tier: TIER.HARD, apply: state => applyHiddenSubset(state, 4) },
            { tier: TIER.EXPERT, apply: applyWWing },
            { tier: TIER.EXPERT, apply: applySimpleColouring },
            { tier: TIER.EXPERT, apply: state => applyFish(state, 4) },
            { tier: TIER.MASTER, apply: applyAlternatingChain },
            { tier: TIER.MASTER, apply: applyAlsXz }
        ];

        // Returns the hardest tier needed to solve `board`. Techniques above `maxTier` are not
        // tried, so a board that gets stuck there returns maxTier + 1 (UNSOLVED_BY_LOGIC when even
        // Master gets stuck).
        function rateByLogic(board, maxTier = TIER.MASTER, maxChainNodes = MAX_CHAIN_NODES) {
            const state = createLogicState(board);
            state.maxChainNodes = maxChainNodes;
            let hardest = TIER.EASY;
            while (state.emptyCount > 0) {
                const step = LOGIC_TECHNIQUES.find(technique => technique.tier <= maxTier && technique.apply(state));
                if (!step) return maxTier + 1;
                hardest = Math.max(hardest, step.tier);
            }
            return hardest;
        }

        // ---- Puzzle generation ----
        // What each difficulty means: the hardest technique tier a puzzle needs (see TIER), with a
        // range for how many givens it keeps, so the tier is the rule and the givens are a nudge.
        // Small grids hardly ever need more than singles (measured over thousands of minimal
        // puzzles: 4x4 never, 5x5 about 1% in Expert), so on 4x4 and 5x5 Easy to Expert are all
        // Easy-tier puzzles that differ by how few givens are left. Master does not exist there
        // (the option is disabled, see updateMasterAvailability). 9x9 uses all five tiers.
        const DIFFICULTY_PROFILES = {
            30: { tier: TIER.EASY, givens: { 4: [9, 10], 5: [15, 17], 9: [38, 46] } },
            40: { tier: TIER.MEDIUM, givens: { 4: [7, 8], 5: [12, 14], 9: [30, 35] } },
            55: { tier: TIER.HARD, givens: { 4: [5, 6], 5: [9, 11], 9: [26, 31] } },
            65: { tier: TIER.EXPERT, givens: { 4: [0, 0], 5: [0, 0], 9: [0, 0] } },
            75: { tier: TIER.MASTER, givens: { 4: [0, 0], 5: [0, 0], 9: [0, 0] } }
        };
        const REACHABLE_TIER_BY_GRID_SIZE = { 4: TIER.EASY, 5: TIER.EASY, 9: TIER.MASTER };

        // Rating needs many solver runs, so hard puzzles can take a while to find. After this
        // long the best puzzle found so far is used, so starting a game never feels stuck.
        const GENERATION_BUDGET_MS = 400;

        // A 9x9 Master puzzle should need real chain thinking, not just a four-node Skyscraper or
        // Turbot Fish, so it must stay unsolved when chains are cut to this many candidates
        // (almost locked sets stay allowed). About one Master puzzle in three passes this test.
        const SHORT_CHAIN_NODES = 6;

        function needsLongChain(board) {
            return rateByLogic(board, TIER.MASTER, SHORT_CHAIN_NODES) === TIER.UNSOLVED_BY_LOGIC;
        }

        // Punches holes one at a time in random order and keeps only removals that leave exactly
        // one solution and, below Expert, still need nothing harder than `tier`. One pass is
        // enough: once a cell is needed, it stays needed. Stops at `targetGivens`, or at
        // `deadline` (a time from performance.now()); the board is valid at any point.
        function punchHoles(solution, tier, targetGivens, deadline = Infinity) {
            const board = solution.map(row => [...row]);
            const cells = [];
            for (let r = 0; r < gridSize; r++) for (let c = 0; c < gridSize; c++) cells.push([r, c]);
            cells.sort(() => Math.random() - 0.5);

            let givens = gridSize * gridSize;
            for (const [r, c] of cells) {
                if (givens <= targetGivens || performance.now() > deadline) break;
                const digit = board[r][c];
                board[r][c] = 0;
                const isUnique = countSolutions(board, 2) === 1;
                // Expert and Master are the top tiers, so only uniqueness limits the removals; the
                // finished puzzle is rated afterwards (it can come out easier, which generatePuzzle retries).
                const isStillRatable = tier >= TIER.EXPERT || rateByLogic(board, tier) <= tier;
                if (isUnique && isStillRatable) givens--;
                else board[r][c] = digit;
            }
            return { board, givens };
        }

        // How far a candidate puzzle is from what the difficulty asks for: 0 is a perfect match,
        // puzzles no technique can finish are the worst fallback.
        function shortfall(candidate, wanted) {
            if (candidate.rating === TIER.UNSOLVED_BY_LOGIC) return Infinity;
            const gap = Math.abs(candidate.rating - wanted.tier);
            const lacksDepth = wanted.needsLongChain && gap === 0 && !needsLongChain(candidate.board);
            return lacksDepth ? 0.5 : gap;
        }

        function generateCandidate(wanted, punchTier, targetGivensRange, deadline) {
            const solution = Array.from({ length: gridSize }, () => Array(gridSize).fill(0));
            fillBoard(solution);
            const [minGivens, maxGivens] = targetGivensRange;
            const targetGivens = minGivens + Math.floor(Math.random() * (maxGivens - minGivens + 1));
            const { board, givens } = punchHoles(solution, punchTier, targetGivens, deadline);
            const candidate = { solution, board, givens, rating: rateByLogic(board) };
            candidate.shortfall = shortfall(candidate, wanted);
            return candidate;
        }

        function generatePuzzle(difficulty) {
            const profile = DIFFICULTY_PROFILES[difficulty];
            const reachableTier = REACHABLE_TIER_BY_GRID_SIZE[gridSize];
            const tier = Math.min(profile.tier, reachableTier);
            const wanted = { tier, needsLongChain: tier === TIER.MASTER };
            const givensRange = profile.givens[gridSize];
            const deadline = performance.now() + GENERATION_BUDGET_MS;

            let best = null;
            do {
                const candidate = generateCandidate(wanted, tier, givensRange, deadline);
                if (candidate.shortfall === 0) return candidate;
                if (!best || candidate.shortfall < best.shortfall) best = candidate;
            } while (performance.now() < deadline);
            if (best.shortfall < Infinity) return best;

            // Out of time with nothing the logic can solve: Hard-tier punching always ends
            // with a solvable puzzle, and is quick, so no deadline is needed.
            const solvableTier = Math.min(TIER.HARD, reachableTier);
            return generateCandidate(wanted, solvableTier, givensRange, Infinity);
        }

        // Bumped by every new game; delayed callbacks from an earlier game check it and give up.
        let gameGeneration = 0;

        function runInCurrentGame(callback, delayMs) {
            const generationWhenScheduled = gameGeneration;
            setTimeout(() => {
                if (generationWhenScheduled === gameGeneration) callback();
            }, delayMs);
        }

        function hasNotes() {
            return notesBoard.some(cellNotes => cellNotes.length > 0);
        }

        function hasPlayerProgress() {
            const hasEntries = Array.from(getCellInputs()).some(input => !input.classList.contains('given') && input.value !== '');
            return hasEntries || hasNotes();
        }

        function isPuzzleFinished() {
            return statusKind === 'autoSolved' || messageEl.classList.contains('msg-success');
        }

        // Asks first when the current puzzle has progress that a new game would throw away.
        async function requestNewGame() {
            if (hasPlayerProgress() && !isPuzzleFinished()) {
                const isConfirmed = await confirmAction({
                    title: 'Start a new game?',
                    message: 'Your current puzzle will be lost.',
                    confirmLabel: 'New Game'
                });
                if (!isConfirmed) return;
            }
            newGameDialog.close();
            newGame();
        }

        function newGame() {
            gameGeneration++;
            const selectedSize = parseInt(gridSizeSelect.value);
            if (selectedSize !== gridSize) {
                setGridSize(selectedSize);
                initGrid();
            }

            setStatus('', 'neutral'); stopFireworks(); clearHighlights(); selectCell(null);

            const puzzle = generatePuzzle(difficultySelect.value);
            solutionBoard = puzzle.solution;
            currentBoard = puzzle.board;

            notesBoard = Array(gridSize * gridSize).fill().map(() => []);
            renderBoard(true); 
            
            if (autoNotesToggle.checked) autoFillNotes();
            else renderNotes();

            updateNumberPad(); saveGameState();
        }

        function renderBoard(animated = false) {
            getCellInputs().forEach((input, index) => {
                const r = Math.floor(index / gridSize); const c = index % gridSize;
                const val = currentBoard[r][c];

                input.value = val === 0 ? '' : val;
                input.classList.remove('given', 'locked', 'anim-pop', 'anim-shake', 'anim-wave', 'error-cell', 'hint-highlight', 'highlight-match', 'selected-cell', 'constraint-line');
                input.style.animationDelay = '0ms';
                if (val !== 0) input.classList.add('given');

                if (animated && animationsEnabled) {
                    input.classList.add('anim-pop');
                    input.style.animationDelay = `${(r * gridSize + c) * 3}ms`;
                    setTimeout(() => {
                        input.classList.remove('anim-pop');
                        input.style.animationDelay = '0ms';
                    }, 500 + ((r * gridSize + c) * 3));
                }
            });
        }

        function revealHintCell(input, digit) {
            const [r, c] = getCellPosition(input);

            input.value = digit;
            input.classList.remove('anim-shake', 'error-cell', 'selected-cell');
            input.classList.add('hint-highlight'); selectCell(input);
            if (!hardModeEnabled) input.classList.add('locked');
            if (animationsEnabled) { input.classList.add('anim-pop'); setTimeout(() => input.classList.remove('anim-pop'), 400); }
            setTimeout(() => input.classList.remove('hint-highlight'), 1200);

            notesBoard[r * gridSize + c] = [];
            removeNotesFromAffected(r, c, digit);
        }

        function giveHint() {
            if (statusKind === 'autoSolved') return;
            stopFireworks(); clearHighlights(); setStatus('', 'neutral');
            if(fastFillMode) { fastFillToggle.checked = false; toggleFastFill(); } 

            const wrongCells = [];
            const emptyCells = [];
            getCellInputs().forEach(input => {
                const [r, c] = getCellPosition(input);
                if (input.value === '') emptyCells.push(input);
                else if (!input.classList.contains('given') && parseInt(input.value) !== solutionBoard[r][c]) wrongCells.push(input);
            });

            // Mistakes come first, so the hint never builds on a wrong value
            const hintCells = wrongCells.length > 0 ? wrongCells : emptyCells;
            let hintMessage = 'No hints needed! The board is currently correct.';
            if (hintCells.length > 0) {
                const hintCell = hintCells[Math.floor(Math.random() * hintCells.length)];
                const [r, c] = getCellPosition(hintCell);
                revealHintCell(hintCell, solutionBoard[r][c]);
                hintMessage = wrongCells.length > 0 ? 'Corrected a mistake to help you progress!' : '';
            }
            
            if (autoNotesToggle.checked) autoFillNotes();
            else renderNotes();

            updateErrors(); updateNumberPad(); checkWinCondition();
            // A win or hard-mode verdict from the check above takes precedence over the hint text
            if (hintMessage && messageEl.textContent === '') setStatus(hintMessage, 'neutral', 'hint');
            saveGameState();
        }

        function solveGame() {
            let staggerIndex = 0;
            setStatus('Solving...', 'neutral'); stopFireworks(); clearHighlights(); selectCell(null);

            let board = getBoardState();
            let tempBoard = board.map(row => [...row]);
            let isSolvable = false;
            let hasAnyConflicts = false;
            
            for(let r=0; r<gridSize; r++){
                for(let c=0; c<gridSize; c++){
                    if(hasConflict(board, r, c)) hasAnyConflicts = true;
                }
            }
            
            if (!hasAnyConflicts) isSolvable = fillBoard(tempBoard);
            let finalSolution = isSolvable ? tempBoard : solutionBoard;

            notesBoard = Array(gridSize * gridSize).fill().map(() => []);
            renderNotes();

            getCellInputs().forEach((input, index) => {
                const r = Math.floor(index / gridSize); const c = index % gridSize;
                if (!input.classList.contains('given') && (input.value == '' || parseInt(input.value) !== finalSolution[r][c])) {
                    if (!hardModeEnabled) input.classList.add('locked');
                    if (animationsEnabled) {
                        runInCurrentGame(() => {
                            input.value = finalSolution[r][c];
                            input.classList.remove('anim-shake', 'error-cell', 'hint-highlight', 'selected-cell');
                            input.classList.add('anim-pop');
                            updateNumberPad();
                        }, staggerIndex * 15);
                        staggerIndex++;
                    } else {
                        input.value = finalSolution[r][c];
                        input.classList.remove('anim-shake', 'error-cell', 'hint-highlight', 'selected-cell');
                    }
                }
            });
            
            if(!animationsEnabled) updateNumberPad();
            runInCurrentGame(() => { 
                updateErrors();
                setStatus('Puzzle Solved Automatically.', 'neutral', 'autoSolved'); saveGameState(); 
            }, (staggerIndex * 15) + 100);
        }
        
        function triggerWaveAnimation() {
            if (!animationsEnabled) return;
            getCellInputs().forEach(input => {
                const [r, c] = getCellPosition(input);
                const delay = (r + c) * 50;

                runInCurrentGame(() => {
                    input.classList.add('anim-wave');
                    setTimeout(() => input.classList.remove('anim-wave'), 600);
                }, delay);
            });
        }

        function checkWinCondition(triggerEffects = true) {
            if (statusKind === 'autoSolved') return;

            let board = getBoardState();
            let isComplete = true; let hasErrors = false;

            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    if (board[r][c] === 0) isComplete = false;
                    if (board[r][c] !== 0 && hasConflict(board, r, c)) hasErrors = true;
                }
            }

            setStatus('', 'neutral');

            if (isComplete) {
                if (!hasErrors) {
                    setStatus('🎉 BRILLIANT! You solved it!', 'success');
                    clearHighlights(); selectCell(null); 
                    if (animationsEnabled && triggerEffects) {
                        triggerWaveAnimation();
                        startFireworks();
                    }
                } else if (hardModeEnabled) setStatus('Board filled, but there are mistakes!', 'error');
            }
        }

        // --- Realistic Firework Engine ---
        const ctx = fireworkCanvas.getContext('2d');
        let particles = []; 
        let fireworkInterval; 
        let fireworkStartTimeout;
        let animationFrameId;
        let isFiring = false;

        function resizeCanvas() { 
            fireworkCanvas.width = fireworkCanvas.offsetWidth;
            fireworkCanvas.height = fireworkCanvas.offsetHeight;
        }

        class Particle {
            constructor(x, y, hue) {
                this.x = x; 
                this.y = y; 
                this.color = `hsl(${hue}, 100%, 60%)`;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = Math.random() * 6 + 2; 
                this.friction = 0.94;
                this.gravity = 0.1;
                this.life = Math.random() * 80 + 40;
                this.opacity = 1;
                this.size = Math.random() * 2.5 + 1.5;
                this.coords = [];
                for(let i=0; i<4; i++) this.coords.push([x,y]);
            }
            update() {
                this.coords.pop();
                this.coords.unshift([this.x, this.y]);
                this.speed *= this.friction;
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed + this.gravity;
                this.life -= 1;
                this.opacity = Math.max(0, this.life / 60);
            }
            draw() {
                ctx.globalAlpha = this.opacity;
                ctx.beginPath();
                const last = this.coords[this.coords.length - 1];
                ctx.moveTo(last[0], last[1]);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = this.size;
                ctx.lineCap = 'round';
                ctx.stroke();
            }
        }

        function createExplosion() {
            const x = (fireworkCanvas.width * 0.2) + Math.random() * (fireworkCanvas.width * 0.6);
            const y = (fireworkCanvas.height * 0.1) + Math.random() * (fireworkCanvas.height * 0.4);
            const baseHue = Math.floor(Math.random() * 360);
            
            for (let i = 0; i < 70; i++) {
                const hue = baseHue + (Math.random() * 30 - 15);
                particles.push(new Particle(x, y, hue));
            }
        }

        function particleLoop() {
            if (!animationsEnabled) return;
            
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)'; 
            ctx.fillRect(0, 0, fireworkCanvas.width, fireworkCanvas.height);
            ctx.globalCompositeOperation = 'source-over';

            particles.forEach(p => { 
                p.update(); 
                p.draw(); 
            });
            particles = particles.filter(p => p.life > 0);
            
            if (particles.length > 0 || isFiring) { 
                animationFrameId = requestAnimationFrame(particleLoop); 
            } else {
                fireworkCanvas.classList.remove('visible');
                canInterruptFireworks = false;
                ctx.clearRect(0, 0, fireworkCanvas.width, fireworkCanvas.height);
            }
        }

        function startFireworks() {
            if (!animationsEnabled) return;
            stopFireworks(); 
            resizeCanvas(); 
            fireworkCanvas.classList.add('visible');
            particles = [];
            isFiring = true;
            canInterruptFireworks = false;
            
            let fwCount = 0;
            
            // Delay fireworks slightly so the wave effect goes first
            fireworkStartTimeout = setTimeout(() => {
                canInterruptFireworks = true; // User can skip fireworks starting from now
                fireworkInterval = setInterval(() => {
                    createExplosion();
                    fwCount++;
                    if (fwCount > 15) { // Twice as long
                        clearInterval(fireworkInterval);
                        isFiring = false;
                    }
                }, 350);
            }, 600); 
            
            if (!animationFrameId) particleLoop();
        }

        function stopFireworks() {
            clearTimeout(fireworkStartTimeout);
            clearInterval(fireworkInterval); 
            cancelAnimationFrame(animationFrameId); 
            animationFrameId = null; 
            particles = [];
            isFiring = false;
            canInterruptFireworks = false;
            if (ctx) ctx.clearRect(0, 0, fireworkCanvas.width, fireworkCanvas.height); 
            fireworkCanvas.classList.remove('visible');
        }

        window.addEventListener('resize', () => { if (fireworkCanvas.classList.contains('visible')) resizeCanvas(); });

        initPage();

    </script>
</body>
</html>
